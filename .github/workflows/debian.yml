name: Debian 12 Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    name: Build Debian 12 .deb
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake pkg-config libgtk-3-dev dpkg-dev file

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S desktop -B desktop/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compile application
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build desktop/build --parallel 2 --verbose
          test -x desktop/build/bin/dumbnavigator
          file desktop/build/bin/dumbnavigator

      - name: Smoke test binary
        shell: bash
        run: |
          set -euxo pipefail
          ldd desktop/build/bin/dumbnavigator

      - name: Assemble Debian filesystem
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p \
            dist/dumbNavigator/DEBIAN \
            dist/dumbNavigator/usr/bin \
            dist/dumbNavigator/usr/share/applications \
            dist/dumbNavigator/usr/share/icons/hicolor/scalable/apps \
            dist/dumbNavigator/usr/share/man/man1 \
            dist/dumbNavigator/usr/share/dumbnavigator/developeit

          install -m 0755 desktop/build/bin/dumbnavigator \
            dist/dumbNavigator/usr/bin/dumbnavigator
          install -m 0644 desktop/resources/dumbnavigator.desktop \
            dist/dumbNavigator/usr/share/applications/dumbnavigator.desktop
          install -m 0644 desktop/resources/dumbnavigator.svg \
            dist/dumbNavigator/usr/share/icons/hicolor/scalable/apps/dumbnavigator.svg
          install -m 0644 desktop/resources/dumbnavigator.1 \
            dist/dumbNavigator/usr/share/man/man1/dumbnavigator.1
          cp -a app/src/main/assets/developeit/. \
            dist/dumbNavigator/usr/share/dumbnavigator/developeit/

          cat > dist/dumbNavigator/DEBIAN/control <<'EOF'
          Package: dumbnavigator
          Version: 1.0.1
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: dumbNavigator project
          Depends: libgtk-3-0
          Description: Native dumbNavigator desktop browser
           Native GTK desktop application for the dumb:// internal web universe.
          EOF

      - name: Build Debian package
        shell: bash
        run: |
          set -euxo pipefail
          dpkg-deb --root-owner-group --build \
            dist/dumbNavigator \
            dist/dumbnavigator_1.0.1_amd64.deb
          test -s dist/dumbnavigator_1.0.1_amd64.deb
          dpkg-deb --info dist/dumbnavigator_1.0.1_amd64.deb
          dpkg-deb --contents dist/dumbnavigator_1.0.1_amd64.deb

      - name: Publish Debian package to /apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apps
          cp dist/dumbnavigator_1.0.1_amd64.deb apps/dumbnavigator_1.0.1_amd64.deb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dumbnavigator_1.0.1_amd64.deb
          if git diff --cached --quiet; then
            echo ".deb unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build: update Debian package"
          git push

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dumbNavigator-debian12-amd64
          path: dist/dumbnavigator_1.0.1_amd64.deb
          if-no-files-found: error
