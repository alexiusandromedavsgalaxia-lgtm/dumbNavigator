name: Debian 12 Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debian:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake pkg-config libgtk-3-dev dpkg-dev
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build desktop/build --parallel 2
      - name: Package Debian
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/dumbNavigator/usr/bin dist/dumbNavigator/usr/share/applications dist/dumbNavigator/usr/share/icons/hicolor/scalable/apps dist/dumbNavigator/usr/share/man/man1 DEBIAN
          install -m 0755 desktop/build/bin/dumbnavigator dist/dumbNavigator/usr/bin/dumbnavigator
          install -m 0644 desktop/resources/dumbnavigator.desktop dist/dumbNavigator/usr/share/applications/dumbnavigator.desktop
          install -m 0644 desktop/resources/dumbnavigator.svg dist/dumbNavigator/usr/share/icons/hicolor/scalable/apps/dumbnavigator.svg
          install -m 0644 desktop/resources/dumbnavigator.1 dist/dumbNavigator/usr/share/man/man1/dumbnavigator.1
          cat > DEBIAN/control <<'EOF'
          Package: dumbnavigator
          Version: 1.0.0
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: dumbNavigator project
          Depends: libgtk-3-0
          Description: Internal dumb:// browser
           Native GTK browser shell for the dumbNavigator internal web universe.
          EOF
          mkdir -p dist/dumbNavigator/DEBIAN
          cp DEBIAN/control dist/dumbNavigator/DEBIAN/control
          dpkg-deb --build dist/dumbNavigator dist/dumbnavigator_1.0.0_amd64.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dumbNavigator-debian12-amd64
          path: dist/dumbnavigator_1.0.0_amd64.deb
          if-no-files-found: error
