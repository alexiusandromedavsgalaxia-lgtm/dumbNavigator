<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070a10;color:#edf3ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{height:100%;display:grid;grid-template-rows:48px 52px 1fr;background:radial-gradient(circle at 20% 0,#18233b 0,#070a10 42%,#05070c 100%)}.tabs{display:flex;align-items:center;gap:7px;padding:7px 9px;background:#0a0f18;border-bottom:1px solid #ffffff12;overflow:auto}.tab{min-width:170px;max-width:260px;height:34px;border:1px solid #ffffff12;border-radius:10px;background:#ffffff07;display:flex;align-items:center;gap:8px;padding:0 9px}.tab.active{background:#172236;border-color:#ffffff20}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{border:0;background:transparent;width:24px;height:24px;border-radius:7px}.newtab{height:34px;min-width:34px;border:1px solid #ffffff12;border-radius:10px;background:#ffffff08}.toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:#0d131e;border-bottom:1px solid #ffffff12}.actions{display:flex;gap:6px}.icon{width:36px;height:36px;border:1px solid #ffffff12;border-radius:10px;background:#151e2c}.icon:disabled{opacity:.35;cursor:default}.address{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid #ffffff14;border-radius:12px;background:#080d15}.address input{width:100%;border:0;outline:0;background:transparent;color:#eef4ff}.main{min-height:0;position:relative}.page{height:100%;width:100%;border:0;background:#fff}.welcome{height:100%;overflow:auto}.panel{position:absolute;right:10px;top:10px;width:min(390px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#0d1420;border:1px solid #ffffff18;border-radius:18px;box-shadow:0 20px 80px #0009;padding:16px;z-index:20}.panel h2{margin:0 0 12px}.panel section{padding:12px 0;border-top:1px solid #ffffff10}.list{display:grid;gap:7px}.item{padding:10px;border:1px solid #ffffff10;border-radius:11px;background:#ffffff05}.item button{border:0;background:transparent;text-align:left;width:100%}.empty{color:#8290a5;padding:18px 4px}.hidden{display:none}.creator{height:100%;display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);gap:10px;padding:10px;background:#070b12}.editor,.previewWrap{min-height:0;border:1px solid #ffffff13;border-radius:16px;overflow:hidden;background:#0b111b}.editor{display:flex;flex-direction:column}.editor header,.previewWrap header{height:42px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10;background:#0e1622}.editor textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:#070a10;color:#dce8ff;padding:15px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.preview{width:100%;height:calc(100% - 42px);border:0;background:white}.home{max-width:1000px;margin:auto;padding:58px 22px 120px}.badge{display:inline-block;padding:8px 12px;border:1px solid #ffffff20;background:#ffffff08;border-radius:999px;color:#cbd6e8}.home h1{font-size:clamp(44px,8vw,78px);line-height:.94;letter-spacing:-3px;margin:22px 0 18px}.home p{color:#aebbd0;line-height:1.65;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:30px}.card{padding:20px;border-radius:20px;border:1px solid #ffffff13;background:#ffffff07}.card h2{margin-top:0}.btn{border:0;padding:11px 15px;border-radius:12px;background:#fff;color:#111;font-weight:800}.muted{color:#8290a5;font-size:13px}.status{font-size:13px;color:#91a0b7}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menuGrid button{padding:12px;border:1px solid #ffffff12;border-radius:11px;background:#ffffff07;text-align:left}.calc{max-width:390px;margin:35px auto;padding:18px;border:1px solid #ffffff15;border-radius:22px;background:#ffffff07}.display{height:72px;padding:14px;border-radius:14px;background:#05070b;text-align:right;font:28px ui-monospace,monospace;overflow:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.keys button{height:56px;border:0;border-radius:12px;background:#1b2638}.notes{height:100%;padding:20px}.notes textarea{width:100%;height:calc(100% - 55px);resize:none;border:1px solid #ffffff13;border-radius:16px;background:#0d131e;color:#edf3ff;padding:16px;outline:0}.studio{height:100%;display:grid;grid-template-columns:220px minmax(280px,1fr) minmax(280px,1fr);gap:1px;background:#ffffff12}.studio aside,.studio .code{min-height:0;background:#0b1019;padding:14px}.studio .code textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:#06090f;color:#dce8ff;font:13px/1.55 ui-monospace,monospace}.studio button{width:100%;padding:10px;margin:4px 0;border:1px solid #ffffff12;border-radius:10px;background:#ffffff08;text-align:left}.studio iframe{width:100%;height:100%;border:0;background:#fff}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 14px;border-radius:11px;background:#172236;border:1px solid #ffffff18;z-index:30;box-shadow:0 12px 40px #0008}.mobileMenu{display:none}@media(max-width:760px){.app{grid-template-rows:44px 96px 1fr}.toolbar{grid-template-columns:1fr auto}.toolbar .actions:first-child{grid-column:1/3}.toolbar .actions:first-child .icon:nth-child(2),.toolbar .actions:first-child .icon:nth-child(3){display:none}.address{grid-column:1}.mobileMenu{display:block}.creator{grid-template-columns:1fr}.previewWrap{display:none}.studio{grid-template-columns:1fr}.studio aside{display:none}.tab{min-width:145px}.home{padding-top:35px}.panel{top:6px;right:6px;width:calc(100% - 12px)}} 
</style>

<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="toolbar">
    <div class="actions">
      <button class="icon" id="back" title="Atrás">←</button><button class="icon" id="forward" title="Adelante">→</button><button class="icon" id="homeBtn" title="Inicio">⌂</button><button class="icon" id="reload" title="Recargar">↻</button>
    </div>
    <form class="address" id="addressForm"><span>⌕</span><input id="address" autocomplete="off" spellcheck="false" aria-label="Dirección"></form>
    <div class="actions"><button class="icon" id="bookmark" title="Marcador">☆</button><button class="icon" id="menu" title="Menú">☰</button><button class="icon mobileMenu" id="newTab" title="Nueva pestaña">＋</button></div>
  </div>
  <main class="main" id="main"></main>
</div>
<script>
(() => {
const HOME="dumb://une.developeit.dev/";
const RESERVED=new Set(["google.com","google.es","google.co.uk","google.de","google.fr","microsoft.com","apple.com","amazon.com","amazon.es","meta.com","facebook.com","instagram.com","youtube.com","youtu.be","x.com","twitter.com","tiktok.com","netflix.com","spotify.com","adobe.com","nvidia.com","intel.com","amd.com","samsung.com","sony.com","nintendo.com","playstation.com","xbox.com","roblox.com","minecraft.net","mojang.com","discord.com","telegram.org","whatsapp.com","github.com","gitlab.com","cloudflare.com","openai.com","wikipedia.org","reddit.com","linkedin.com","paypal.com","ebay.com","booking.com","airbnb.com","uber.com","ikea.com","nike.com","coca-cola.com","pepsi.com","mcdonalds.com","starbucks.com","bbc.com","cnn.com","nytimes.com","reuters.com","walmart.com","tesla.com","ibm.com","oracle.com","salesforce.com","shopify.com","wordpress.com","wordpress.org","mozilla.org","firefox.com","opera.com","huawei.com","xiaomi.com"]);
const pages={};
pages.home=`<!doctype html><html lang="es"><body><main class="home"><span class="badge">◆ dumbNavigator</span><h1>tu web.<br>tu universo.</h1><p>Un navegador con su propio espacio web interno. <b>DumbEngine</b> analiza HTML/CSS y dibuja las páginas dentro del universo <b>dumb://</b>.</p><div class="grid"><section class="card"><h2>crear una web</h2><p>Diseña una página, elige su dirección interna y publícala gratis.</p><button class="btn" data-nav="dumb://une.developeit.dev/new">Crear mi web →</button></section><section class="card"><h2>dominios internos</h2><p>Los nombres y rutas pertenecen al sistema de dominios de dumbNavigator.</p></section><section class="card"><h2>offline-first</h2><p>Las páginas del sistema funcionan sin servidor. Tus webs creadas se guardan localmente en este navegador.</p></section></div></main></body></html>`;
pages.about=`<!doctype html><html lang="es"><body><main class="home"><span class="badge">dumbNavigator · web</span><h1>tu navegador dentro de dumb://</h1><p>Esta es la versión web del proyecto. Conserva el concepto de espacio interno, historial, marcadores, pestañas, publicación local y las herramientas del navegador original.</p><div class="grid"><section class="card"><h2>DumbEngine</h2><p>En la aplicación original, DumbEngine analiza HTML/CSS sin WebView. En la versión web, el navegador usa un iframe aislado para representar páginas HTML modernas.</p></section><section class="card"><h2>almacenamiento</h2><p>Historial, marcadores, notas y webs publicadas se almacenan localmente mediante almacenamiento del navegador.</p></section></div><p><button class="btn" data-nav="dumb://une.developeit.dev/">volver al inicio →</button></p></main></body></html>`;
pages.help=`<!doctype html><html lang="es"><body><main class="home"><h1>ayuda</h1><p>Escribe <code>uuu.miweb.com</code> para entrar en una dirección interna. Si escribes <code>miweb.com</code>, se añade automáticamente <code>uuu.</code>.</p><div class="grid"><section class="card"><h2>navegación</h2><p>← y → mantienen el historial de la pestaña. ☆ guarda marcadores. ↻ recarga. ☰ abre herramientas.</p></section><section class="card"><h2>crear webs</h2><p>Abre <code>dumb://une.developeit.dev/new</code>, escribe tu HTML y publícalo. La publicación es local.</p></section><section class="card"><h2>rutas</h2><p>También puedes usar /about, /docs, /gallery, /calculator, /notes y /studio.</p></section></div></main></body></html>`;
pages.docs=`<!doctype html><html lang="es"><body><main class="home"><h1>dumb://</h1><p>Documentación del navegador interno.</p><div class="grid"><section class="card"><h2>prefijos</h2><p><code>uuu</code> y <code>jit</code> son prefijos especiales.</p></section><section class="card"><h2>publicación</h2><p>Las webs creadas se guardan en el almacenamiento local. No registran DNS ni compran dominios.</p></section><section class="card"><h2>reservas</h2><p>Los dominios de empresas conocidas están reservados.</p></section></div></main></body></html>`;
pages.gallery=`<!doctype html><html lang="es"><body><main class="home"><h1>galería offline</h1><p class="muted">colección visual integrada.</p><div class="grid"><section class="card"><h2>nebula</h2><p>vector local</p></section><section class="card"><h2>aurora</h2><p>vector local</p></section><section class="card"><h2>orbit</h2><p>vector local</p></section><section class="card"><h2>signal</h2><p>vector local</p></section></div></main></body></html>`;

let tabs=[],active=0;
const getJSON=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.querySelector(".main").appendChild(e);setTimeout(()=>e.remove(),1500)};
function normalize(raw){let s=(raw||"").trim();if(!s)return HOME;if(!s.includes("://"))s="dumb://"+s;if(!s.startsWith("dumb://"))return s;try{const u=new URL(s);let h=u.hostname.toLowerCase();if(!h.includes("."))h="uuu."+h;return "dumb://"+h+(u.pathname||"/")+(u.search||"")+(u.hash||"")}catch{return HOME}}
function domainHost(u){try{return new URL(u).hostname.toLowerCase()}catch{return ""}}
function isReserved(h){let bare=h.startsWith("uuu.")||h.startsWith("jit.")?h.slice(h.indexOf(".")+1):h;return h==="une.developeit.dev"||h==="uuu.une.developeit.dev"||RESERVED.has(bare)||[...RESERVED].some(x=>bare.endsWith("."+x))}
function validHost(raw){let h=raw.trim().toLowerCase().replace(/^dumb:\/\//,"");if(!h.includes("."))h="uuu."+h;if(!/^[a-z0-9.-]+$/.test(h)||h.length>253)return null;if(!/^(uuu|jit)\./.test(h))h="uuu."+h;if(isReserved(h))return null;return h}
function current(){return tabs[active]}
function addHistory(url){let a=getJSON("dumbHistory",[]);a=a.filter(x=>x!==url);a.push(url);if(a.length>100)a=a.slice(-100);save("dumbHistory",a)}
function bookmarkToggle(){let a=getJSON("dumbBookmarks",[]),u=current().url;const i=a.findIndex(x=>x.url===u);if(i>=0)a.splice(i,1);else a.push({url:u,title:current().title});save("dumbBookmarks",a);renderChrome();toast(i>=0?"marcador eliminado":"marcador guardado")}
function newTab(url=HOME){tabs.push({url,title:"Nueva pestaña",history:[url],index:0});active=tabs.length-1;render()}
function navigate(raw,push=true){const u=normalize(raw);const t=current();if(push){t.history=t.history.slice(0,t.index+1);if(t.history[t.index]!==u)t.history.push(u);t.index=t.history.length-1}t.url=u;addHistory(u);render()}
function back(){const t=current();if(t.index>0){t.index--;t.url=t.history[t.index];render()}}
function forward(){const t=current();if(t.index<t.history.length-1){t.index++;t.url=t.history[t.index];render()}}
function closeTab(i){if(tabs.length===1){tabs[0]={url:HOME,title:"Nueva pestaña",history:[HOME],index:0};active=0}else{tabs.splice(i,1);if(active>=tabs.length)active=tabs.length-1;if(i<active)active--}}
function getPublished(){return getJSON("dumbSites",{})}
function setPublished(x){save("dumbSites",x)}
function internalPath(u){try{return new URL(u).pathname.replace(/^\//,"").split("/")[0].toLowerCase()}catch{return ""}}
function templateFor(u){const p=internalPath(u);if(domainHost(u)==="une.developeit.dev"||domainHost(u)==="uuu.une.developeit.dev"){return pages[p==="about"?"about":p==="help"?"help":p==="docs"?"docs":p==="gallery"?"gallery":"" ]||null}const sites=getPublished(),h=domainHost(u);if(sites[h]?.html)return sites[h].html;if(sites[h]?.wildcard){const parts=h.split(".");for(let i=1;i<parts.length-1;i++){const root=parts.slice(i).join(".");if(sites[root]?.wildcard)return sites[root].html}}return null}
function escapeAttr(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
function rewriteInternal(html){return html.replace(/href\s*=\s*["'](dumb:\/\/[^"']+)["']/gi,(m,u)=>`href="#" data-nav="${escapeAttr(u)}"`)}
function showRaw(html,url){const main=document.getElementById("main");main.innerHTML='<iframe class="page" id="pageFrame" sandbox="allow-scripts allow-forms"></iframe>';const f=document.getElementById("pageFrame");f.srcdoc=rewriteInternal(html);f.addEventListener("load",()=>{try{f.contentDocument.addEventListener("click",e=>{const n=e.target.closest("[data-nav]");if(n){e.preventDefault();navigate(n.getAttribute("data-nav"))}})}catch{}})}
function showExternal(url){const main=document.getElementById("main");main.innerHTML='<iframe class="page" id="pageFrame" referrerpolicy="no-referrer"></iframe>';document.getElementById("pageFrame").src=url}
function showPage(){const u=current().url;let html=templateFor(u);if(html){showRaw(html,u);return}if(u.startsWith("https://")||u.startsWith("http://")){showExternal(u);return}showRaw('<!doctype html><html><body><main class="home"><h1>404</h1><p>No existe esta página en dumb://.</p><p><button class="btn" data-nav="dumb://une.developeit.dev/">volver al inicio</button></p></main></body></html>',u)}
function renderTabs(){const e=document.getElementById("tabs");e.innerHTML="";tabs.forEach((t,i)=>{const d=document.createElement("div");d.className="tab "+(i===active?"active":"");const s=document.createElement("span");s.textContent=t.title||t.url;const c=document.createElement("button");c.textContent="×";c.onclick=ev=>{ev.stopPropagation();closeTab(i);render()};d.append(s,c);d.onclick=()=>{active=i;render()};e.appendChild(d)});const b=document.createElement("button");b.className="newtab";b.textContent="＋";b.onclick=()=>{newTab()};e.appendChild(b)}
function renderChrome(){const t=current();document.getElementById("address").value=t.url;document.getElementById("back").disabled=t.index<=0;document.getElementById("forward").disabled=t.index>=t.history.length-1;const a=getJSON("dumbBookmarks",[]);document.getElementById("bookmark").textContent=a.some(x=>x.url===t.url)?"★":"☆";renderTabs()}
function render(){renderChrome();showPage()}
function openCreator(){document.getElementById("main").innerHTML=`<div class="creator"><section class="editor"><header><b>crear una web</b><span class="status" id="creatorStatus"></span></header><div style="padding:12px"><input id="siteDomain" placeholder="miweb.com" style="width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff14;background:#070b12;color:#fff"><select id="sitePrefix" style="margin-top:8px;padding:10px;border-radius:10px;background:#101824;color:#fff"><option>uuu</option><option>jit</option></select><button class="btn" id="publishSite" style="margin-top:8px">publicar</button></div><textarea id="siteCode"></textarea></section><section class="previewWrap"><header><b>vista previa</b><button class="icon" id="runPreview">▶</button></header><iframe class="preview" id="creatorPreview" sandbox="allow-scripts allow-forms"></iframe></section></div>`;const code=document.getElementById("siteCode");code.value='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi web</title><style>body{font-family:system-ui;background:#101522;color:white;padding:32px}button{padding:12px 16px;border:0;border-radius:12px}</style></head><body><h1>hola 👋</h1><p>mi primera web con dumbNavigator.</p><button onclick="this.textContent=\'funciona ✓\'">probar</button></body></html>';const run=()=>document.getElementById("creatorPreview").srcdoc=rewriteInternal(code.value);document.getElementById("runPreview").onclick=run;document.getElementById("publishSite").onclick=()=>{const h=validHost(document.getElementById("sitePrefix").value+"."+document.getElementById("siteDomain").value);if(!h){toast("dominio no válido o reservado");return}const s=getPublished();s[h]={html:code.value,wildcard:false};setPublished(s);toast("web publicada localmente");navigate("dumb://"+h+"/")};run()}
function openPanel(){const main=document.getElementById("main"),p=document.createElement("div");p.className="panel";p.id="menuPanel";p.innerHTML=`<h2>dumbNavigator</h2><div class="menuGrid"><button data-action="bookmarks">★ marcadores</button><button data-action="history">◷ historial</button><button data-action="copy">▣ copiar dirección</button><button data-action="clear">⌫ borrar historial</button><button data-action="new">＋ nueva pestaña</button><button data-action="creator">✦ crear una web</button><button data-action="studio">▣ Studio</button><button data-action="notes">✎ notas</button><button data-action="calc">⌗ calculadora</button><button data-action="about">ⓘ acerca de</button></div><section id="panelContent"></section>`;main.appendChild(p);p.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,pc=p.querySelector("#panelContent");if(a==="bookmarks"){const x=getJSON("dumbBookmarks",[]);pc.innerHTML='<h3>marcadores</h3>'+(x.length?'<div class="list">'+x.map((v,i)=>'<div class="item"><button data-open="'+i+'">'+v.title+'<br><span class="muted">'+v.url+'</span></button></div>').join("")+'</div>':'<div class="empty">no tienes marcadores todavía</div>');pc.onclick=ev=>{const n=ev.target.closest("[data-open]");if(n){navigate(x[+n.dataset.open].url);p.remove()}}}else if(a==="history"){const x=getJSON("dumbHistory",[]).reverse();pc.innerHTML='<h3>historial reciente</h3>'+(x.length?'<div class="list">'+x.map((v,i)=>'<div class="item"><button data-open="'+i+'">'+v+'</button></div>').join("")+'</div>':'<div class="empty">historial vacío</div>');pc.onclick=ev=>{const n=ev.target.closest("[data-open]");if(n){navigate(x[+n.dataset.open]);p.remove()}}}else if(a==="copy"){navigator.clipboard?.writeText(current().url).then(()=>toast("dirección copiada")).catch(()=>toast("no se pudo copiar"));p.remove()}else if(a==="clear"){localStorage.removeItem("dumbHistory");toast("historial borrado");p.remove()}else if(a==="new"){p.remove();newTab()}else if(a==="creator"){p.remove();openCreator()}else if(a==="studio"){p.remove();openStudio()}else if(a==="notes"){p.remove();openNotes()}else if(a==="calc"){p.remove();openCalc()}else if(a==="about"){p.remove();navigate("dumb://une.developeit.dev/about")}})}
function openNotes(){document.getElementById("main").innerHTML='<div class="notes"><div style="height:45px;display:flex;align-items:center;gap:10px"><b>notas locales</b><button class="icon" id="saveNote">guardar</button></div><textarea id="noteBox" placeholder="escribe aquí..."></textarea></div>';document.getElementById("noteBox").value=localStorage.dumbNotes||"";document.getElementById("saveNote").onclick=()=>{localStorage.dumbNotes=document.getElementById("noteBox").value;toast("guardado")}}
function openCalc(){document.getElementById("main").innerHTML='<div class="calc"><div class="display" id="calcDisplay">0</div><div class="keys" id="calcKeys"></div></div>';let exp="";const d=document.getElementById("calcDisplay");["7","8","9","/","4","5","6","*","1","2","3","-","0",".","%","+","(",")","C","="].forEach(x=>{const b=document.createElement("button");b.textContent=x;b.onclick=()=>{if(x==="C"){exp="";d.textContent="0"}else if(x==="="){try{if(!/^[0-9+*/().% -]+$/.test(exp))throw 0;exp=String(Function("return "+exp)());d.textContent=exp}catch{exp="";d.textContent="error"}}else{exp+=x;d.textContent=exp}};document.getElementById("calcKeys").appendChild(b)})}
