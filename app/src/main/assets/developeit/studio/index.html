<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · dumbNavigator</title><style>*{box-sizing:border-box}body{margin:0;background:#070a11;color:#eef3ff;font-family:system-ui,sans-serif}header{height:64px;padding:10px 16px;border-bottom:1px solid #ffffff15;background:#0c111b;display:flex;align-items:center;gap:12px}main{height:calc(100vh - 64px);display:grid;grid-template-columns:260px 1fr 360px}.side,.right{padding:18px;background:#0b1019;border-right:1px solid #ffffff12}.right{border-left:1px solid #ffffff12;border-right:0}button{width:100%;padding:12px;margin:5px 0;border:1px solid #ffffff16;border-radius:12px;background:#ffffff0b;color:#fff;text-align:left}button:hover{background:#ffffff15}.code{padding:18px;background:#06080d;overflow:auto}textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:#dce8ff;font:13px ui-monospace,monospace;line-height:1.6}.preview{height:100%;width:100%;border:0;background:#fff}.small{color:#8795ac;font-size:12px;line-height:1.5}h1{font-size:18px;margin:0}.logo{font-weight:800}.accent{color:#a9bfff}</style></head><body><header><div class="logo">◆ dumbNavigator Studio</div><div class="small">editor local · sin Internet</div></header><main><aside class="side"><h3>Proyecto</h3><button onclick="loadTemplate()">▣ página HTML</button><button onclick="loadApp()">▣ mini app</button><button onclick="loadDocs()">▣ documentación</button><h3>Herramientas</h3><button onclick="run()">▶ ejecutar</button><button onclick="save()">⬡ guardar borrador</button><button onclick="publish()">↑ publicar en dumb://</button><p class="small">El editor, la vista previa y la ejecución funcionan dentro de dumbNavigator. Los recursos externos están bloqueados.</p></aside><section class="code"><textarea id="src" spellcheck="false"></textarea></section><aside class="right"><h3>Vista previa</h3><iframe id="out" class="preview" sandbox="allow-scripts"></iframe></aside></main><script>const src=document.getElementById('src'),out=document.getElementById('out');const base='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;padding:30px;background:#101521;color:white}button{padding:10px 15px;border:0;border-radius:10px}</style></head><body><h1>mi proyecto</h1><p>creado con dumbNavigator Studio.</p></body></html>';function loadTemplate(){src.value=base;run()}function loadApp(){src.value=base.replace('mi proyecto','mi mini app').replace('</body>','<button onclick="this.textContent=\'funciona ✓\'">probar</button></body>');run()}function loadDocs(){src.value='<!doctype html><html><body><h1>Documentación</h1><h2>Mi web</h2><p>Esta página pertenece al universo dumb://.</p></body></html>';run()}function run(){out.srcdoc=src.value}function save(){localStorage.setItem('dumbStudioDraft',src.value);alert('borrador guardado localmente')}function publish(){if(window.Android)Android.publish('uuu.studio.local',src.value,false);else alert('abre Studio desde dumbNavigator para publicar')}src.value=localStorage.getItem('dumbStudioDraft')||base;run()</script></body></html>
