<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>body{margin:0;background:#080b12;color:#fff;font:16px system-ui}main{max-width:360px;margin:40px auto;padding:18px;border:1px solid #fff2;border-radius:22px;background:#ffffff08}.display{height:70px;padding:14px;background:#05070b;border-radius:14px;margin-bottom:12px;text-align:right;font:28px monospace;overflow:auto}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:58px;border:0;border-radius:13px;background:#1b2638;color:white;font-size:18px}button:active{transform:scale(.97)}</style></head><body><main><div class="display" id="d">0</div><div class="keys" id="k"></div></main><script>let exp='';const d=document.getElementById('d');function put(x){exp+=x;d.textContent=exp||'0'}function clear(){exp='';d.textContent='0'}function calc(){try{if(!/^[0-9+*/().% -]+$/.test(exp))throw 0;exp=String(Function('return '+exp)());d.textContent=exp}catch(e){d.textContent='error';exp=''}}['7','8','9','/','4','5','6','*','1','2','3','-','0','.','%','+','(',')','C','='].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>x==='C'?clear():x==='='?calc():put(x);document.getElementById('k').appendChild(b)})</script></body></html>
