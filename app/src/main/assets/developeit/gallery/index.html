<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dumb Gallery</title><style>body{margin:0;background:#080b12;color:#eef3fb;font:15px system-ui}main{max-width:1000px;margin:auto;padding:22px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{min-height:170px;border:1px solid #fff2;border-radius:18px;padding:18px;background:linear-gradient(145deg,#18243a,#0b101a);display:flex;flex-direction:column;justify-content:end}.orb{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#b6d6ff,#7b61ff);margin-bottom:auto}.muted{color:#8f9db2}</style></head><body><main><h1>galería offline</h1><p class="muted">Una colección visual empaquetada dentro de dumbNavigator.</p><div class="grid"><div class="card"><div class="orb"></div><b>nebula</b><span class="muted">vector local</span></div><div class="card"><div class="orb"></div><b>aurora</b><span class="muted">vector local</span></div><div class="card"><div class="orb"></div><b>orbit</b><span class="muted">vector local</span></div><div class="card"><div class="orb"></div><b>signal</b><span class="muted">vector local</span></div><div class="card"><div class="orb"></div><b>liquid</b><span class="muted">vector local</span></div><div class="card"><div class="orb"></div><b>terminal</b><span class="muted">vector local</span></div></div></main></body></html>
