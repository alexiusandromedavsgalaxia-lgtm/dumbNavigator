<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notas locales</title><style>body{margin:0;background:#080b12;color:#edf2fa;font:15px system-ui}main{max-width:850px;margin:auto;padding:20px}textarea{width:100%;min-height:65vh;box-sizing:border-box;border:1px solid #fff2;border-radius:18px;background:#0d131e;color:#e8efff;padding:18px;outline:none;resize:vertical;font:15px system-ui}.bar{display:flex;gap:8px;margin:10px 0}button{border:0;border-radius:10px;padding:9px 14px;background:#23334a;color:#fff}</style></head><body><main><h1>notas locales</h1><div class="bar"><button onclick="save()">guardar</button><button onclick="clearNote()">vaciar</button><span id="s"></span></div><textarea id="n" placeholder="escribe aquí..."></textarea></main><script>const n=document.getElementById('n'),s=document.getElementById('s');n.value=localStorage.dumbNotes||'';function save(){localStorage.dumbNotes=n.value;s.textContent='guardado';setTimeout(()=>s.textContent='',1200)}function clearNote(){n.value='';save()}</script></body></html>
