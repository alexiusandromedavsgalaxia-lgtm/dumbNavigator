plugins { id 'com.android.application' }

android {
    namespace 'dev.dumbnavigator'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.dumbnavigator'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0-chromium'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
